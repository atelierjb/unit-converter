<html>

<head>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <section>
        <header>
            <p class="tagline">Metric / Imperial</p>
            <h1>
                Unit Conversion
            </h1>
            <input type="text" id="input-el" placeholder="000">
            <button id="convert-btn">
                Convert
            </button>
        </header>
        <div id="results">
            <div class="card">
                <div class="card-header">
                    <p class="tagline">Meter / Feet</p>
                    <h2>Length</h2>
                </div>
                <p id="length-el"></p>
            </div>
            <div class="card">
                <div class="card-header">
                    <p class="tagline">Liter / Gallons</p>
                    <h2>Volume</h2>
                </div>
                <p id="volume-el"></p>
            </div>
            <div class="card">
                <div class="card-header">
                    <p class="tagline">Kilograms / Pounds</p>
                    <h2>Mass</h2>
                </div>
                <p id="mass-el"></p>
            </div>
        </div>
    </section>
    <script src="index.js"></script>
</body>

</html>
